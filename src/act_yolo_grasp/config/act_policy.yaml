# Parameters for act_policy_node.py (node name: act_policy_inference_node)
#
# ACT hyperparameters MUST match training (and the ONNX/OpenVINO export):
# camera order, chunk_size, hidden_dim, dim_feedforward, enc/dec layers, nheads.

act_policy_inference_node:
  ros__parameters:
    # ---------- inference backend ----------
    backend: "openvino"        # openvino | onnx | torch
    ov_device: "NPU"           # GPU | NPU | CPU | AUTO
    device: "cpu"              # torch device (ensembling math only on deploy)

    # TODO: dir containing policy_best.xml/.bin (+ dataset_stats.pkl, REQUIRED)
    ckpt_dir: "/home/felix/projects/Segmentation-Guided-Grasping/src/act_yolo_grasp/models"
    ckpt_name: "policy_best.ckpt"   # stem also resolves .xml / .onnx defaults
    ov_model_path: ""               # default: <ckpt_dir>/<ckpt stem>.xml
    onnx_path: ""                   # default: <ckpt_dir>/<ckpt stem>.onnx
    onnx_provider: "cpu"

    # ---------- topics ----------
    observation_topic: "/sync/qpos"
    action_topic: "/motor_action_angle_topic"
    llm_state_topic: "/llm_state"

    # ---------- cameras (order must match training) ----------
    camera_names: ["top", "left_wrist", "right_wrist"]
    image_topics: ["/top/YOLO_mask", "/left_wrist/YOLO_mask", "/right_wrist/YOLO_mask"]
    image_resize_width: 320
    image_resize_height: 240

    # ---------- ACT model config (must match the trained checkpoint) ----------
    freq: 10.0
    kl_weight: 50.0
    chunk_size: 10
    hidden_dim: 512
    dim_feedforward: 3200
    lr: 0.00005
    lr_backbone: 0.00001
    backbone: "resnet18"
    enc_layers: 4
    dec_layers: 7
    nheads: 8
    sep_CNN: true
    receiver_obs_dim: 17
    qpos_dim: 17

    # ---------- temporal ensemble ----------
    temporal_ensemble: true
    ensemble_k: 0.05

    # ---------- confidence monitor ----------
    confidence_enabled: true
    confidence_obs_start: 25
    confidence_obs_end: 35
    confidence_threshold: 0.05
    confidence_confirm_frames: 5
    confidence_recovery_steps: 40

    # ---------- offline replay (testing without the robot) ----------
    use_dummy_observation: false
    dummy_observation_csv_path: ""
    dummy_observation_loop: false
    use_dummy_images: false
    dummy_image_dirs: ["/tmp/cam0", "/tmp/cam1", "/tmp/cam2"]
    dummy_image_loop: false

    # ---------- QoS ----------
    obs_qos_depth: 1
    image_qos_depth: 1
    obs_best_effort: true
    image_best_effort: true

    # ---------- CSV logging (empty path = disabled) ----------
    log_actions_to_csv: true
    action_csv_path: ""
    log_observations_to_csv: true
    observation_csv_path: ""
    log_metrics_to_csv: true
    metric_csv_path: ""
